<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="gallery">
    <h2>My Gallery</h2>
    <div class="gallery-grid">

      <div class="gallery-item">
        <img src="images/project1.jpg" alt="Project 1">
        <div class="overlay">Project 1</div>
      </div>

      <div class="gallery-item">
        <img src="images/project2.jpg" alt="Project 2">
        <div class="overlay">Project 2</div>
      </div>

      <div class="gallery-item">
        <img src="images/work_samples.jpg" alt="Work Sample">
        <div class="overlay">Work Sample</div>
      </div>

    </div>
  </section>

  <div id="lightbox">
    <span onclick="closeLightbox()">✕</span>
    <button id="prev" onclick="changeImage(-1)">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="next" onclick="changeImage(1)">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
